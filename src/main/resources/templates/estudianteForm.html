<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div th:replace="fragment/navbar :: navbar"></div>
    <main class="container mt-5">
        <div class="card shadow-sm border-0 my-4">
            <div class="card-body p-4">
                <h4 class="card-title mb-4 text-success fw-bold">Registrar Estudiante</h4>
                <form th:action="@{/guardar}" th:object="${nuevoEstudiante}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">ID</label>
                            <input type="number" th:field="*{id}" class="form-control" placeholder="Ej. 101" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Edad</label>
                            <input type="number" th:field="*{edad}" class="form-control" placeholder="Ej. 20" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nombre</label>
                            <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ingresa el nombre" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Apellido</label>
                            <input type="text" th:field="*{apellido}" class="form-control" placeholder="Ingresa el apellido" required>
                        </div>
                        <div class="col-12 mt-4 text-end">
                            <button type="submit" class="btn btn-success px-4">
                                <i class="bi bi-check-circle me-1"></i> Guardar Estudiante
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
