<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div th:replace="fragment/navbar :: navbar"></div>

    <main class="container mt-5">
        <section>
            <div class="d-flex justify-content-between align-items-center">
                <h2 class="mb-4 text-success fw-bold">Lista de Estudiantes</h2>
                <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#estudianteModel">
                Agregar Estudiante
                </button>
            </div>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Edad</th>
                    <th>Validar Edad</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${estudiantes}">
                    <th th:text="${e.id}"></th>
                    <td th:text="${e.nombre}"></td>
                    <td th:text="${e.apellido}"></td>
                    <td th:text="${e.edad}"></td>
                    <td>
                        <span th:text="${e.edad >= 18 ? 'Mayor de edad' : 'Menor de edad'}"
                              th:class="${e.edad >= 18 ? 'badge bg-success' : 'badge bg-danger'}">
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </section>

        <section>
            <div class="modal fade" id="estudianteModel" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <form th:action="@{/guardar}" th:object="${nuevoEstudiante}" method="post">
                            <div class="modal-header">
                                <h5 class="modal-title text-success fw-bold">Registrar Estudiante</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">ID</label>
                                        <input type="number" th:field="*{id}" class="form-control" placeholder="Ej. 101" readonly required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Edad</label>
                                        <input type="number" th:field="*{edad}" class="form-control" placeholder="Ej. 20" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Nombre</label>
                                        <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ingresa el nombre" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Apellido</label>
                                        <input type="text" th:field="*{apellido}" class="form-control" placeholder="Ingresa el apellido" required>
                                    </div>
                                </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cerrar</button>
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle me-1"></i> Guardar Estudiante
                            </button>
                        </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
